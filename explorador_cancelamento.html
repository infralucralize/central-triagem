<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explorador — Listas de Cancelamento</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2/lib/msal-browser.min.js"></script>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7fafd;margin:0;padding:24px;color:#0d1328;}
  h1{font-size:18px;margin-bottom:4px;}
  p.sub{color:#64748b;font-size:13px;margin-top:0;margin-bottom:20px;}
  button{background:#2563eb;color:#fff;border:none;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
  button:disabled{opacity:.6;cursor:default;}
  #status{margin-top:14px;font-size:13px;color:#475569;white-space:pre-wrap;}
  pre{background:#0d1328;color:#91dbe4;padding:16px;border-radius:8px;font-size:12px;overflow:auto;max-height:70vh;margin-top:16px;white-space:pre-wrap;word-break:break-word;}
  .copybtn{margin-top:10px;background:#0c7488;}
</style>
</head>
<body>
  <h1>🔍 Explorador — Listas de Cancelamento</h1>
  <p class="sub">Lista as colunas e um item de exemplo das listas "Cancelamento de Clientes" (Contabilidade) e "Cancelamento e Suspenso de Clientes" (Tech).</p>
  <button id="btn" onclick="run()">Entrar e Explorar</button>
  <button class="copybtn" id="copyBtn" style="display:none;" onclick="copyOut()">📋 Copiar resultado</button>
  <div id="status"></div>
  <pre id="out" style="display:none;"></pre>

<script>
const CONFIG = {
  clientId: "0876f783-54bf-4149-8ce3-4d72d4b5af94",
  tenantId: "5173aa83-66e1-49f3-9128-f2251b43294d",
  hostname: "lucralize.sharepoint.com",
  lists: {
    Contabilidade: { sitePath: null, listName: "Cancelamento de Clientes" },
    Tech: { sitePath: "LUCRALIZETECH", listName: "Cancelamento e Suspenso de Clientes" }
  }
};

let msalInstance = null;
function setStatus(txt){ document.getElementById('status').textContent = txt; }

async function ensureMsal(){
  if(msalInstance) return msalInstance;
  msalInstance = new msal.PublicClientApplication({
    auth: {
      clientId: CONFIG.clientId,
      authority: `https://login.microsoftonline.com/${CONFIG.tenantId}`,
      redirectUri: window.location.origin + window.location.pathname
    },
    cache: { cacheLocation: 'sessionStorage' }
  });
  return msalInstance;
}

async function graphGet(token, path){
  const res = await fetch(`https://graph.microsoft.com/v1.0${path}`, {
    headers: { 'Authorization': `Bearer ${token}` }
  });
  if(!res.ok){
    const t = await res.text();
    throw new Error(`Graph GET ${path} -> ${res.status}: ${t}`);
  }
  return res.json();
}

async function run(){
  const btn = document.getElementById('btn');
  btn.disabled = true; btn.textContent = 'Entrando...';
  setStatus('Autenticando com a conta Lucralize...');
  try{
    await ensureMsal();
    const result = await msalInstance.loginPopup({ scopes: ["User.Read", "Sites.Read.All"] });
    const token = result.accessToken;
    let out = '';
    for(const divisao of Object.keys(CONFIG.lists)){
      const cfg = CONFIG.lists[divisao];
      setStatus(`Buscando lista de ${divisao}...`);
      try{
        const sitePathSuffix = cfg.sitePath ? `:/sites/${cfg.sitePath}` : '';
        const site = await graphGet(token, `/sites/${CONFIG.hostname}${sitePathSuffix}`);
        const lists = await graphGet(token, `/sites/${site.id}/lists?$select=id,name,displayName`);
        const list = lists.value.find(l => l.displayName === cfg.listName || l.name === cfg.listName);
        if(!list){
          out += `\n=== ${divisao} — LISTA "${cfg.listName}" NÃO ENCONTRADA ===\n`;
          out += 'Listas disponíveis neste site:\n' + lists.value.map(l => ' - ' + l.displayName).join('\n') + '\n';
          continue;
        }
        const cols = await graphGet(token, `/sites/${site.id}/lists/${list.id}/columns?$select=name,displayName,hidden,readOnly`);
        const visible = cols.value.filter(c => !c.hidden);
        out += `\n=== ${divisao} — Lista "${cfg.listName}" ===\n`;
        out += 'Colunas (nome interno -> nome de exibição):\n';
        visible.forEach(c => { out += `${c.name}  ->  "${c.displayName}"${c.readOnly?' (somente leitura)':''}\n`; });
        const items = await graphGet(token, `/sites/${site.id}/lists/${list.id}/items?$expand=fields&$top=5`);
        out += `\n--- Primeiros ${(items.value||[]).length} itens ---\n`;
        (items.value||[]).forEach((item, i) => {
          out += `\nItem ${i+1}:\n`;
          Object.entries(item.fields||{}).forEach(([k,v]) => { out += `  ${k}: ${JSON.stringify(v)}\n`; });
        });
      }catch(e){
        out += `\n=== ${divisao}: ERRO — ${e.message} ===\n`;
      }
    }
    document.getElementById('out').style.display = 'block';
    document.getElementById('out').textContent = out;
    document.getElementById('copyBtn').style.display = 'inline-block';
    setStatus('Concluído. Copie o resultado abaixo e envie.');
    btn.textContent = 'Concluído ✅';
  }catch(e){
    console.error(e);
    setStatus('Erro: ' + e.message);
    btn.disabled = false; btn.textContent = 'Entrar e Explorar';
  }
}

function copyOut(){
  const txt = document.getElementById('out').textContent;
  navigator.clipboard.writeText(txt).then(() => {
    setStatus('Resultado copiado para a área de transferência!');
  }).catch(() => {
    setStatus('Não consegui copiar automaticamente — selecione o texto manualmente.');
  });
}
</script>
</body>
</html>
